# Host nginx on port 80 for the pick-dispatch demo.
# Include this file from the http {} block, or paste the server block into
# your existing nginx configuration. Only port 80 needs to be public.
#
# Routes:
#   /pick/api/...   -> backend 127.0.0.1:7999/api/...
#   /pick/ws/...    -> backend 127.0.0.1:7999/ws/...   (WebSocket)
#   /pick/...       -> frontend 127.0.0.1:7998/...      (static SPA)
#
# If nginx itself runs in the Docker network pick-dispatch-net, replace
# 127.0.0.1:7998 with frontend:80 and 127.0.0.1:7999 with backend:7999.

server {
    listen 80;
    server_name 39.106.14.83;

    # Convenience redirect.
    location = /pick {
        return 301 /pick/;
    }

    # REST API
    location /pick/api/ {
        proxy_pass http://127.0.0.1:7999/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket: /pick/ws/picking -> /ws/picking
    location /pick/ws/ {
        proxy_pass http://127.0.0.1:7999/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Vue SPA: strip /pick/ and let the frontend container serve assets and
    # history-mode routes (/shop, /pda, ...).
    location /pick/ {
        proxy_pass http://127.0.0.1:7998/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
