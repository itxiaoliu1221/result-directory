# Host nginx on port 80 for the pick-dispatch demo.
# Include this file from the http {} block, or merge the server block into
# your existing nginx configuration.
#
# Public paths:
#   /front/...        -> frontend 127.0.0.1:7998/...
#   /backend/api/...  -> backend  127.0.0.1:7999/backend/api/...
#   /backend/ws/...   -> backend  127.0.0.1:7999/backend/ws/...  (WebSocket)
#
# If nginx itself runs in the Docker network pick-dispatch-net, replace
# 127.0.0.1:7998 with frontend:80 and 127.0.0.1:7999 with backend:7999.

server {
    listen 80;
    server_name 39.106.14.83;

    location = /front {
        return 301 /front/;
    }

    # Vue SPA: strip /front/ and let the frontend container serve assets and
    # history-mode routes (/shop, /pda, ...).
    location /front/ {
        proxy_pass http://127.0.0.1:7998/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # REST API: backend runs with context-path /backend, so preserve the path.
    location /backend/api/ {
        proxy_pass http://127.0.0.1:7999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket: /backend/ws/picking
    location /backend/ws/ {
        proxy_pass http://127.0.0.1:7999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
