spring:
  datasource:
    url: jdbc:h2:mem:pickdispatch;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

dispatch:
  max-snapshot-age-minutes: 10

app:
  demo:
    enabled: false

logging:
  level:
    com.example.pickdispatch: WARN
    org.hibernate.SQL: WARN
